openapi: 3.1.0
info:
  title: API Facturation
  version: 1.4.0
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        "200":
          description: OK
  /auth/login:
    post:
      operationId: Login
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        "200":
          description: Token émis
  /invoices/{id}:
    get:
      operationId: get_invoice
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Facture
        "404":
          description: Introuvable
  /invoices/export:
    get:
      operationId: exportInvoices
      responses:
        "200":
          description: CSV
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
